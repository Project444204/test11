services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    # Ports removed - Dokploy handles routing automatically
    # If you need to expose the port, use a different port or let Dokploy manage it
    # ports:
    #   - "3000:3000"
    networks:
      - 3d-hand-network

networks:
  3d-hand-network:
    driver: bridge

